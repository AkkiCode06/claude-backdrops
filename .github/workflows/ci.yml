name: Checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Themes parse, have unique ids and paint
        run: node --experimental-strip-types scripts/check-themes.ts
      - name: Every style draws every palette (dark, light, low power, moving, still)
        run: node --experimental-strip-types scripts/check-styles.ts
