name: Check themes
on:
  pull_request:
    paths: ['themes/**', 'hooks/**']
  push:
    branches: [main]
    paths: ['themes/**', 'hooks/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-strip-types scripts/check-themes.ts
