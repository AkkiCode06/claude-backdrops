name: Bug report
description: Something isn't working
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: cc-version
    attributes:
      label: Claude Code version
      description: Run `claude --version`.
      placeholder: 2.1.325
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Gradient Flow version
      description: Shown under + → Plugins, or `claude plugin list`.
      placeholder: 0.3.3
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Desktop app (Mac), Desktop app (Windows), Mobile, Terminal]
    validations:
      required: true
  - type: dropdown
    id: motion
    attributes:
      label: Motion setting
      options: [Auto, Always move, Still, Not sure]
